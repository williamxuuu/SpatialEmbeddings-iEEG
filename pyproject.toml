[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "locemb"
version = "0.1.0"
description = "Spatial (location) encodings for intracranial EEG foundation models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy",
  "scipy",
  "scikit-learn",
  "pyyaml",
  "pandas",
  "matplotlib",
  "nibabel",
  "nilearn>=0.11",
]

[project.optional-dependencies]
# Pinned to the commit the adapter was written and tested against.
neuroprobe = ["neuroprobe @ git+https://github.com/azaho/neuroprobe@b282acd497134bf0454cd36e14fb03bf0fa91c42", "h5py",
              "requests", "beautifulsoup4"]  # last two: its download script
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
