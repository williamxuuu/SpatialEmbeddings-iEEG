# Real data: Neuroprobe tasks on Brain Treebank (Lite sessions).
# Set `root` (or export ROOT_DIR_BRAINTREEBANK). See the top of
# src/locemb/data/neuroprobe_adapter.py for what each key does.
_base: base.yaml
data:
  name: neuroprobe
  root: null                       # must end in /braintreebank, e.g. /storage/scratch1/<you>/braintreebank
  cache_dir: null                  # filtered recordings; default $LOCEMB_CACHE_DIR or <root>/../locemb_cache
  eval_name: speech                # any of neuroprobe.config.NEUROPROBE_TASKS
  split: cross_session             # within_session | cross_session | cross_subject
  fold: 0                          # within_session only
  electrodes: lite                 # lite (<=120 per subject, the benchmark's) | all
  # (subject, test trial) for all 6 Lite subjects. cross_session trains on
  # each subject's other Lite trial: sub 1 trial 1; subs 2, 3, 4, 7, 10 trial 0.
  subject_trials: [[1, 2], [2, 4], [3, 1], [4, 1], [7, 1], [10, 1]]
  test_subjects: [2, 7]            # cross_subject only; best region coverage by the other 4 (see docs/pilot.md)
  exclude_test_movie: true         # cross_subject only
preprocess:                        # notch/bandpass/resample run on whole recordings (cached)
  reref: car                       # per window, over the electrodes the model sees
  notch_hz: 60
  bandpass: [1, 200]
  resample_hz: 512                 # 2048 Hz -> 512 Hz keeps compute down
  zscore: true
  clip: 10
