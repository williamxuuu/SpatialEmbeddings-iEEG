# Density x resolution: does the best spatial resolution depend on how many
# electrodes each region gets? (the paper's main relationship)
#
# Cross-subject: the model must generalize to a new person's electrodes (in
# cross-session the same electrodes are in train and test, so finer just means
# "more like an electrode ID" and no tradeoff is expected).
#   people:     train on all 5 other people, test on the held-out one
#   density:    e100 = all of each TRAINING person's electrodes; e10 = a random 10%
#               (data.train_electrode_frac; the held-out person keeps all of theirs;
#               the subset changes with seed via data.train_electrode_seed)
#   resolution: none + cubes of side 80, 40, 20, 10, 5 mm (pure resolution knob,
#               no anatomy; atlases are the follow-up)
#   fold:       leave-one-subject-out over all 6 Neuroprobe Lite people (n = 6)
# 6 folds x 2 densities x 6 encodings x 24 seeds = 1728 runs, recipe r2_stft_car.
#
# Why thin electrodes instead of dropping people (the first design, 1/2/5 people,
# cancelled 2026-11-20 before running): the user's axis is electrodes per region,
# with the representative 5 people kept. Dropping people mostly changed coverage
# (20 mm: 0.34 with 1 person, 0.74 with 5) because electrodes come in shafts.
# Measured from coordinates (5 training people, mean over held-out people and
# 6 thinning draws), e10 vs e100:
#   cube   electrodes per occupied cube   coverage of held-out person
#   80 mm        10.4 vs 104                   1.00 vs 1.00
#   40 mm         2.6 vs 16.7                  0.85 vs 0.92
#   20 mm         1.0 vs 4.4                   0.43 vs 0.74
#   10 mm         1.0 vs 2.0                   0.11 vs 0.44
#    5 mm         1.0 vs 1.0                   0.02 vs 0.12
# So 10% thins electrodes per cube at every size AND lowers coverage at <= 20 mm;
# H3 separates the two. (25% is cleaner but under-powered, see below.) Each
# training person keeps 11-24 electrodes at 10%.
#
# Power (simulated, Phase 0 cross-subject run SD 0.059, best size shifting 0.25
# octave per doubling of electrodes; H1 / H2 power at peak gain 0.03 / 0.05 AUC):
#   e25 vs e100, 12 seeds:  0.23/0.35  0.63/0.72
#   e25 vs e100, 24 seeds:  0.38/0.65  0.85/0.93
#   e10 vs e100, 12 seeds:  0.57/0.70  0.93/1.00
#   e10 vs e100, 16 seeds:  0.60/0.85  0.98/0.98
#   e10 vs e100, 24 seeds:  0.80/0.95  1.00/1.00   <- chosen
# 9 half-octave cube sizes instead of 5 did not help at equal runs.
#
# Analysis, fixed before running (scripts/analyze_density.py; outcome = test AUC
# of the held-out person at the last epoch):
#   gain(h) = AUC(cube h) - AUC(none), same person, density and seed.
#   H1 (primary): slope of gain on log2(80 / h) (how much each halving of cube size
#      helps); interaction = slope(e100) - slope(e10). Prediction: > 0 (finer
#      resolution pays off more when regions have more electrodes). Permutation test
#      of density labels within person x seed; sign-flip over the 6 people as the
#      population-level version (smallest possible p = 0.031).
#   H2: pooled vertex regression gain ~ 1 + x + x^2 + s + x s + x^2 s,
#      x = log2(80 / h), s = log2(density level): octaves finer the optimum moves per
#      doubling of electrodes; bootstrap CI over people. Theory h* ~ n^(-1/(d+2)):
#      0.2-0.33 per doubling, i.e. 0.66-1.1 octaves between e10 and e100.
#   H3 (mechanism): leave-one-person-out R^2 of gain ~ x * coverage, with and without
#      density. Density adding beyond coverage = an electrodes-per-region effect.
#
# Paths below are relative to spatialResolutionTesting/, where every job runs.
config: configs/neuroprobe_v2.yaml
exp_name: density_resolution
overrides:
  model.name: transformer
  data.split: cross_subject
  data.eval_name: speech
  data.electrodes: all
  data.subject_trials: [[1, 2], [2, 4], [3, 1], [4, 1], [7, 1], [10, 1]]
  model.frontend: stft
  preprocess.zscore: session
  preprocess.reref: car
  model.readout: cls
axes:
  fold:
    ho01: {data.test_subjects: [1]}
    ho02: {data.test_subjects: [2]}
    ho03: {data.test_subjects: [3]}
    ho04: {data.test_subjects: [4]}
    ho07: {data.test_subjects: [7]}
    ho10: {data.test_subjects: [10]}
  density:
    e10:  {data.train_electrode_frac: 0.1}
    e100: {data.train_electrode_frac: 1.0}
  spatial:
    none:   {spatial.type: none}
    grid80: {spatial.type: region, spatial.atlas: grid80}
    grid40: {spatial.type: region, spatial.atlas: grid40}
    grid20: {spatial.type: region, spatial.atlas: grid20}
    grid10: {spatial.type: region, spatial.atlas: grid10}
    grid5:  {spatial.type: region, spatial.atlas: grid5}
  seed:
    "0": {seed: 0, data.train_electrode_seed: 0}
    "1": {seed: 1, data.train_electrode_seed: 1}
    "2": {seed: 2, data.train_electrode_seed: 2}
    "3": {seed: 3, data.train_electrode_seed: 3}
    "4": {seed: 4, data.train_electrode_seed: 4}
    "5": {seed: 5, data.train_electrode_seed: 5}
    "6": {seed: 6, data.train_electrode_seed: 6}
    "7": {seed: 7, data.train_electrode_seed: 7}
    "8": {seed: 8, data.train_electrode_seed: 8}
    "9": {seed: 9, data.train_electrode_seed: 9}
    "10": {seed: 10, data.train_electrode_seed: 10}
    "11": {seed: 11, data.train_electrode_seed: 11}
    "12": {seed: 12, data.train_electrode_seed: 12}
    "13": {seed: 13, data.train_electrode_seed: 13}
    "14": {seed: 14, data.train_electrode_seed: 14}
    "15": {seed: 15, data.train_electrode_seed: 15}
    "16": {seed: 16, data.train_electrode_seed: 16}
    "17": {seed: 17, data.train_electrode_seed: 17}
    "18": {seed: 18, data.train_electrode_seed: 18}
    "19": {seed: 19, data.train_electrode_seed: 19}
    "20": {seed: 20, data.train_electrode_seed: 20}
    "21": {seed: 21, data.train_electrode_seed: 21}
    "22": {seed: 22, data.train_electrode_seed: 22}
    "23": {seed: 23, data.train_electrode_seed: 23}
