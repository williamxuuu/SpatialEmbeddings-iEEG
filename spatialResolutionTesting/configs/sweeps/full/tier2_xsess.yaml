# Tier 2 (xsess): fills in the resolution curve (Schaefer 100/1000, 40/10/5 mm
# cubes) and a 3-point soft-width curve: Destrieux Gaussian sigma 1.5 and 6 mm,
# with sigma 3 mm from Tier 1. Run the width rows ONLY if Tier 1 shows
# destrieux_gauss3 beats hard destrieux; after a null result at 3 mm, searching
# other widths would be fishing. Speech + onset, 3 seeds. 120 runs.
# Also holds lobes and the ho_prob pair, moved from Tier 1 to cut cost.
config: configs/neuroprobe_v2.yaml
exp_name: tier2_xsess
overrides:
  model.name: transformer
  data.split: cross_session
axes:
  task:
    speech:
      data.eval_name: speech
    onset:
      data.eval_name: onset
  direction:
    testB:
      data.subject_trials:
      - - 1
        - 2
      - - 2
        - 4
      - - 3
        - 1
      - - 4
        - 1
      - - 7
        - 1
      - - 10
        - 1
    testA:
      data.subject_trials:
      - - 1
        - 1
      - - 2
        - 0
      - - 3
        - 0
      - - 4
        - 0
      - - 7
        - 0
      - - 10
        - 0
  spatial:
    schaefer100:
      spatial.type: region
      spatial.atlas: schaefer100
    schaefer1000:
      spatial.type: region
      spatial.atlas: schaefer1000
    grid40:
      spatial.type: region
      spatial.atlas: grid40
    grid10:
      spatial.type: region
      spatial.atlas: grid10
    grid5:
      spatial.type: region
      spatial.atlas: grid5
    destrieux_gauss1p5:
      spatial.type: region
      spatial.atlas: destrieux
      spatial.mode: gaussian
      spatial.sigma_mm: 1.5
    destrieux_gauss6:
      spatial.type: region
      spatial.atlas: destrieux
      spatial.mode: gaussian
      spatial.sigma_mm: 6
    lobes:
      spatial.type: region
      spatial.atlas: lobes
    ho_prob_soft:
      spatial.type: region
      spatial.source: prob_atlas
      spatial.atlas: ho_prob
      spatial.mode: prob
      spatial.sigma_mm: 0
    ho_prob_argmax:
      spatial.type: region
      spatial.source: prob_atlas
      spatial.atlas: ho_prob
      spatial.mode: hard
      spatial.sigma_mm: 0
  seed:
  - 0
  - 1
  - 2
